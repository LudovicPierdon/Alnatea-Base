# Commande fournisseur automatique — exécution planifiée sur les serveurs GitHub (PC éteint ou non).
# Toutes les 30 minutes : node commandes/commande-fournisseur.mjs <arguments>.
# Les arguments planifiés viennent de la variable de dépôt ARGUMENTS_PLANIFIES (Settings → Secrets and variables →
# Actions → Variables) : vide = simulation, « --appliquer » = écriture dans Base. Le jeton BASELINKER_TOKEN est un
# secret de dépôt (même page, onglet Secrets) : il n'apparaît jamais dans les journaux.
# Lancement manuel possible depuis l'onglet Actions (« Run workflow ») avec des arguments libres, ex. « --rattrapage ».
name: Commande fournisseur

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      arguments:
        description: "Options du script (vide = simulation ; --appliquer ; --rattrapage ; --jours=N)"
        required: false
        default: ""

concurrency:
  group: commande-fournisseur
  cancel-in-progress: false

jobs:
  commande-fournisseur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Lancer le script
        env:
          BASELINKER_TOKEN: ${{ secrets.BASELINKER_TOKEN }}
          BASELINKER_INVENTORY_ID: "27452"
          ARGUMENTS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.arguments || vars.ARGUMENTS_PLANIFIES }}
        run: |
          echo "Arguments : '${ARGUMENTS}'"
          node commandes/commande-fournisseur.mjs ${ARGUMENTS}
