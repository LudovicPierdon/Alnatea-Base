# Stock check — exécution planifiée sur les serveurs GitHub (PC éteint ou non).
# Toutes les 5 minutes (minimum GitHub, démarrage souvent retardé de quelques minutes) : node commandes/stock-check.mjs <arguments>.
# Décision du 2026-09-14 : cadence rapprochée pour préparer les commandes juste après une réception.
# Les arguments planifiés viennent de la variable de dépôt ARGUMENTS_STOCK_CHECK (Settings → Secrets and variables →
# Actions → Variables) : vide = simulation, « --appliquer » = écriture dans Base. Le jeton BASELINKER_TOKEN est un
# secret de dépôt (même page, onglet Secrets) : il n'apparaît jamais dans les journaux.
# Lancement manuel possible depuis l'onglet Actions (« Run workflow ») avec des arguments libres.
name: Stock check

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      arguments:
        description: "Options du script (vide = simulation ; --appliquer ; --commande=ID ; --jours=N)"
        required: false
        default: ""

# Groupe propre : le stock check ne fait que passer des commandes couvertes en « En stock » (setOrderStatus), sans
# conflit possible avec les deux autres scripts (trace, brouillons, remboursements). Rester dans le groupe commun
# ferait annuler leurs exécutions en attente par les passages fréquents du stock check.
concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  stock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Lancer le script
        env:
          BASELINKER_TOKEN: ${{ secrets.BASELINKER_TOKEN }}
          BASELINKER_INVENTORY_ID: "27452"
          ARGUMENTS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.arguments || vars.ARGUMENTS_STOCK_CHECK }}
        run: |
          echo "Arguments : '${ARGUMENTS}'"
          node commandes/stock-check.mjs ${ARGUMENTS}
